# coturn — konfigurasi acuan LONGROLL (DEC-073 OPEN; provider-neutral). BELUM diverifikasi pada TURN nyata.
# Kredensial sementara "use-auth-secret": username = "<expiry-unix>:<participantId>", password = base64(HMAC-SHA1(secret, username)).
# Sama persis dengan GET /api/rooms/:code/turn-credentials di service realtime (TURN_SHARED_SECRET, TURN_TTL_SECONDS=3600).

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=GANTI_DENGAN_TURN_SHARED_SECRET   # rahasia, JANGAN di-commit
realm=turn.longroll.example
total-quota=100
stale-nonce=600
no-multicast-peers
no-cli
no-tcp-relay                                          # UDP relay saja; TCP relay → vektor proxy

# TH-09 / TC-SEC-019: relay HANYA ke alamat publik. Tolak loopback, privat, link-local, CGNAT, multicast, metadata cloud.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255            # termasuk metadata cloud 169.254.169.254
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Batasi rentang port relay dan bitrate per sesi (RK-05 biaya TURN).
min-port=49160
max-port=49300
max-bps=1500000
user-quota=12
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1
